name: Atnaujinti lankomumą (oficialios lygų svetainės)

# Australija, Suomija, Latvijos–Estijos lyga, ABA, Italija ir Izraelis.
# Jei oficiali svetainė rungtynių lankomumo nepublikuoja – trūkstamas rungtynes užpildo Flashscore (flashscore_fill.py).
# Kiekviena lyga renkama atskirai, rezultatai – data/<aplankas>/ (tas pats formatas kaip LKL/BBL).

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      league:
        description: "Tik viena lyga (aus, fin, lvee, aba, ita, isr) – tuščia = visos"
        type: string
        default: ""
      recheck_days:
        description: "Vienkartinis patikrinimas: iki kiek dienų po rungtynių dar bandyti gauti trūkstamą lankomumą (pvz. 365). Tuščia = kaip įprasta"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: attendance-official
  cancel-in-progress: false

env:
  SEASON: "2026-27"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { league: aus,  dir: data/nbl }
          - { league: fin,  dir: data/fin }
          - { league: lvee, dir: data/lvee }
          - { league: aba,  dir: data/aba }
          - { league: ita,  dir: data/ita }
          - { league: isr,  dir: data/isr }
    steps:
      - name: Praleisti, jei pasirinkta kita lyga
        id: pick
        run: |
          if [ -n "${{ inputs.league }}" ] && [ "${{ inputs.league }}" != "${{ matrix.league }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.pick.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Įdiegti priklausomybes
        if: steps.pick.outputs.skip != 'true'
        run: pip install requests beautifulsoup4

      - name: Surinkti lankomumą (${{ matrix.league }})
        id: collect
        if: steps.pick.outputs.skip != 'true'
        continue-on-error: true
        env:
          RECHECK_DAYS_INPUT: ${{ inputs.recheck_days }}
        run: |
          EXTRA=""
          if [ -n "$RECHECK_DAYS_INPUT" ]; then
            case "$RECHECK_DAYS_INPUT" in
              *[!0-9]*) echo "::error::recheck_days turi būti skaičius"; exit 1 ;;
            esac
            EXTRA="--recheck-days $RECHECK_DAYS_INPUT"
          fi
          python official_attendance.py --league "${{ matrix.league }}" --season "$SEASON" --data-dir "${{ matrix.dir }}" $EXTRA

      # Atsarginis šaltinis: jei oficiali svetainė kai kurių sužaistų rungtynių lankomumo nepublikuoja,
      # bandome paimti iš Flashscore (tik trūkstamoms rungtynėms; oficialus skaičius niekada nekeičiamas)
      - name: Ar reikia Flashscore atsarginio varianto
        id: fsneed
        if: steps.pick.outputs.skip != 'true'
        run: |
          if python flashscore_attendance.py --missing-check "${{ matrix.dir }}"; then
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Įdiegti Flashscore priklausomybes
        if: steps.fsneed.outputs.need == 'true'
        continue-on-error: true
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Flashscore lankomumas (atsarginis)
        id: fs
        if: steps.fsneed.outputs.need == 'true'
        continue-on-error: true
        env:
          RECHECK_DAYS_INPUT: ${{ inputs.recheck_days }}
        run: |
          EXTRA=""
          if [ -n "$RECHECK_DAYS_INPUT" ]; then
            case "$RECHECK_DAYS_INPUT" in
              *[!0-9]*) echo "::error::recheck_days turi būti skaičius"; exit 1 ;;
            esac
            EXTRA="--recheck-days $RECHECK_DAYS_INPUT"
          fi
          python flashscore_attendance.py --league "${{ matrix.league }}" --season "$SEASON" --max-fetch 80 --max-pages 15 --no-averages $EXTRA

      - name: Užpildyti trūkstamas rungtynes iš Flashscore
        if: steps.fsneed.outputs.need == 'true'
        continue-on-error: true
        run: python flashscore_fill.py --league "${{ matrix.league }}" --season "$SEASON" --data-dir "${{ matrix.dir }}"

      - name: Įrašyti pakeitimus
        if: steps.pick.outputs.skip != 'true'
        run: |
          git config user.name "attendance-bot"
          git config user.email "attendance-bot@users.noreply.github.com"
          git add "${{ matrix.dir }}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Pakeitimų nėra"
            exit 0
          fi
          git commit -m "${{ matrix.league }} lankomumas: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1

      - name: Pranešti apie nepavykusį nuskaitymą
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::${{ matrix.league }}: lygos svetainės nuskaityti nepavyko – žr. žurnalą aukščiau. Puslapyje rodomas įspėjimas (run_status.json)."
          exit 1
