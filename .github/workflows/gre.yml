name: Atnaujinti GBL lankomumą (Graikija)

# Lankomumas – iš Flashscore (ne visoms rungtynėms), arena ir rungtynių sąrašas – iš esake.gr.

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      recheck_days:
        description: "Vienkartinis patikrinimas: iki kiek dienų po rungtynių dar bandyti gauti trūkstamą lankomumą (pvz. 365). Tuščia = kaip įprasta"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: attendance-gre
  cancel-in-progress: false

env:
  SEASON: "2026-27"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Įdiegti priklausomybes
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Flashscore lankomumas
        id: fs
        continue-on-error: true
        env:
          RECHECK_DAYS_INPUT: ${{ inputs.recheck_days }}
        run: |
          EXTRA=""
          if [ -n "$RECHECK_DAYS_INPUT" ]; then
            case "$RECHECK_DAYS_INPUT" in
              *[!0-9]*) echo "::error::recheck_days turi būti skaičius"; exit 1 ;;
            esac
            EXTRA="--recheck-days $RECHECK_DAYS_INPUT"
          fi
          python flashscore_attendance.py --league gre --season "$SEASON" --max-fetch 80 --max-pages 15 --fail-if-empty $EXTRA

      - name: esake.gr arenos + sujungimas
        id: official
        continue-on-error: true
        env:
          UPSTREAM_OUTCOME: ${{ steps.fs.outcome }}
          UPSTREAM_NAME: "Flashscore lankomumo nuskaitymas"
          RECHECK_DAYS_INPUT: ${{ inputs.recheck_days }}
        run: |
          EXTRA=""
          if [ -n "$RECHECK_DAYS_INPUT" ]; then
            case "$RECHECK_DAYS_INPUT" in
              *[!0-9]*) echo "::error::recheck_days turi būti skaičius"; exit 1 ;;
            esac
            EXTRA="--recheck-days $RECHECK_DAYS_INPUT"
          fi
          python official_attendance.py --league gre --season "$SEASON" --data-dir data/gre $EXTRA

      - name: Įrašyti pakeitimus
        run: |
          git config user.name "attendance-bot"
          git config user.email "attendance-bot@users.noreply.github.com"
          git add data/gre 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Pakeitimų nėra"
            exit 0
          fi
          git commit -m "GBL lankomumas: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1

      - name: Pranešti apie nepavykusį nuskaitymą
        if: steps.fs.outcome == 'failure' || steps.official.outcome == 'failure'
        run: |
          echo "::error::GBL: Flashscore arba esake.gr nuskaityti nepavyko – žr. žurnalą aukščiau. Puslapyje rodomas įspėjimas (run_status.json)."
          exit 1
