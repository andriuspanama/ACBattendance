name: Atnaujinti BSL lankomumą (Turkija, rankiniu būdu)

# tbf.org.tr blokuoja automatinį skaitymą (Cloudflare), todėl lankomumas suvedamas
# ranka į Google Sheets lapą „BSL 26/27 games“: Date | Home | Away | Arena | Attendance | Link.
# Ši užduotis lapą nuskaito ir paverčia tokiu pat formatu kaip kitos lygos (data/bsl/).

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: attendance-bsl
  cancel-in-progress: false

env:
  SEASON: "2026-27"
  SHEET_ID: "1Qt4ijFGDmvoLLHb-gCbcAF9KGts6ZC-RHwWzQw68cZI"
  SHEET_NAME: "BSL 26/27 games"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Įdiegti priklausomybes
        run: pip install requests beautifulsoup4

      - name: Nuskaityti lapą
        id: sheet
        continue-on-error: true
        run: python manual_attendance.py --sheet-id "$SHEET_ID" --sheet "$SHEET_NAME" --league BSL --season "$SEASON" --data-dir data/bsl

      - name: Įrašyti pakeitimus
        run: |
          git config user.name "attendance-bot"
          git config user.email "attendance-bot@users.noreply.github.com"
          git add data/bsl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Pakeitimų nėra"
          else
            git commit -m "BSL lankomumas: $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && exit 0
              sleep $((RANDOM % 15 + 5))
            done
            exit 1
          fi

      - name: Pranešti apie nepavykusį nuskaitymą
        if: steps.sheet.outcome == 'failure'
        run: |
          echo "::error::BSL: lapo arba FIBA LiveStats nuskaityti nepavyko – žr. žurnalą aukščiau. Puslapyje rodomas įspėjimas (run_status.json)."
          exit 1
