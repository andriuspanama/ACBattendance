<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lankomumas · ACB + LKL</title>
  <meta name="description" content="ACB ir LKL namų rungtynių lankomumo statistika" />
  <style>
    :root {
      --bg: #0c1118;
      --surface: #151c27;
      --surface2: #1b2433;
      --row: #121821;
      --row-alt: #161e2a;
      --border: #243044;
      --text: #eef2f8;
      --muted: #8b9bb0;
      --accent: #f5a623;
      --blue: #3d8bfd;
      --green: #3dd68c;
      --red: #f07178;
      --rank1: #ffd700;
      --rank2: #c0c0c0;
      --rank3: #cd7f32;
      --radius: 14px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      background-image:
        radial-gradient(ellipse 70% 40% at 20% -10%, rgba(61,139,253,.12), transparent),
        radial-gradient(ellipse 50% 35% at 100% 0%, rgba(245,166,35,.08), transparent);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    header { text-align: center; margin-bottom: 1.25rem; }
    header h1 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; letter-spacing: -.02em; }
    header h1 span { color: var(--accent); }
    .subtitle { color: var(--muted); font-size: .92rem; margin-top: .25rem; }
    .tabs {
      display: flex; justify-content: center; gap: .6rem;
      margin: 1.1rem 0 1.25rem; flex-wrap: wrap;
    }
    .tab {
      display: inline-flex; align-items: center; gap: .55rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; padding: .45rem .95rem .45rem .55rem;
      cursor: pointer; color: var(--muted); font-weight: 600; font-size: .9rem;
      transition: .15s ease;
    }
    .tab img, .tab .league-logo {
      width: 32px; height: 32px; object-fit: contain; border-radius: 8px;
      background: #fff; padding: 2px;
    }
    .tab small { font-weight: 500; font-size: .68rem; color: var(--muted); opacity: .75; margin-left: .1rem; }
    .tab:hover { border-color: var(--blue); color: var(--text); }
    .tab.active {
      background: linear-gradient(135deg, rgba(61,139,253,.2), rgba(245,166,35,.12));
      border-color: var(--blue); color: var(--text);
      box-shadow: 0 0 0 1px rgba(61,139,253,.25);
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: .6rem 1.2rem;
      justify-content: center; font-size: .82rem; color: var(--muted); margin-bottom: 1rem;
    }
    .meta strong { color: var(--text); }
    .cards {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: .65rem; margin-bottom: 1.15rem;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .85rem; text-align: center;
    }
    .card .label {
      font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); margin-bottom: .2rem;
    }
    .card .value { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .card .value.accent { color: var(--accent); }
    .card .value.blue { color: var(--blue); }
    .card .value.green { color: var(--green); }
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: .5rem; padding: .8rem 1rem;
      border-bottom: 1px solid var(--border); background: var(--surface2);
    }
    .panel-header h2 { font-size: .95rem; font-weight: 600; }
    .search {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: .35rem .65rem; font-size: .85rem; width: 170px; outline: none;
    }
    .search:focus { border-color: var(--blue); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    thead th {
      text-align: left; padding: .65rem .9rem; font-size: .7rem;
      text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
      font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap;
      cursor: pointer; user-select: none; background: var(--surface2);
    }
    thead th:hover { color: var(--text); }
    thead th.num, tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; }
    tbody tr:nth-child(odd) { background: var(--row); }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: rgba(61,139,253,.08); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: .7rem .9rem; vertical-align: middle; }
    .club-cell { display: flex; align-items: center; gap: .65rem; }
    .club-logo {
      width: 28px; height: 28px; object-fit: contain; border-radius: 6px;
      background: rgba(255,255,255,.06); flex-shrink: 0;
    }
    .club-logo.missing {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: .7rem; color: var(--muted); background: var(--surface2);
      width: 28px; height: 28px; border-radius: 6px;
    }
    .club-name { font-weight: 600; }
    .rank {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.65rem; height: 1.65rem; border-radius: 50%;
      font-size: .78rem; font-weight: 700; background: var(--surface2); color: var(--muted);
    }
    .rank.r1 { background: var(--rank1); color: #1a1a1a; }
    .rank.r2 { background: var(--rank2); color: #1a1a1a; }
    .rank.r3 { background: var(--rank3); color: #1a1a1a; }
    .bar-track {
      height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; min-width: 80px;
    }
    .bar-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #f5a623, #3d8bfd);
    }
    .section-title {
      font-size: .95rem; font-weight: 600; margin: 1.75rem 0 .65rem;
      display: flex; align-items: center; gap: .45rem;
    }
    .section-title .badge {
      font-size: .68rem; background: var(--surface2); color: var(--muted);
      padding: .12rem .45rem; border-radius: 999px;
    }
    footer {
      text-align: center; margin-top: 2rem; font-size: .78rem; color: var(--muted);
    }
    footer a { color: var(--blue); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .loading, .error { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
    .error { color: var(--red); }
    th.sorted-asc .sort-arrow::after { content: " ▲"; opacity: 1; }
    th.sorted-desc .sort-arrow::after { content: " ▼"; opacity: 1; }
    .sort-arrow::after { content: ""; opacity: .35; }
    @media (max-width: 640px) {
      .hide-sm { display: none; }
      .search { width: 130px; }
      thead th, tbody td { padding: .55rem .6rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Namų <span>lankomumas</span></h1>
      <p class="subtitle">Europos krepšinio lygų statistika</p>
    </header>

    <div class="tabs" id="tabs">
      <button class="tab active" data-league="acb" type="button">
        <img class="league-logo" src="https://acb.com/next/images/components/main-navbar/logo-acb.svg" alt="ACB"
             onerror="this.onerror=null;this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Basketball.png/64px-Basketball.png'" />
        <span>ACB</span>
        <small>Ispanija</small>
      </button>
      <button class="tab" data-league="lkl" type="button">
        <img class="league-logo" src="https://lkl.lt/images/favicons/android-chrome-192x192.png" alt="LKL"
             onerror="this.onerror=null;this.src='https://www.lkl.lt/images/lkl-logo-for-sharing-5.jpg'" />
        <span>LKL</span>
        <small>Lietuva</small>
      </button>
    </div>

    <div class="meta" id="meta"></div>
    <div id="app"><div class="loading">Kraunama…</div></div>

    <footer>
      Duomenys:
      <a href="https://www.acb.com" target="_blank" rel="noopener">acb.com</a> ·
      <a href="https://lkl.lt" target="_blank" rel="noopener">lkl.lt</a>
      · <a href="https://github.com/andriuspanama/ACBattendance" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script>
    const TEAM_LOGOS = {
      "Valencia Basket": "https://static.acb.com/img/www/clubes2026/202627ValenciaBasket40Anys.png",
      "Unicaja": "https://static.acb.com/img/www/clubes2024/2324UnicajaLogo.png",
      "Recoletas Salud San Pablo Burgos": "https://static.acb.com/img/www/clubes2025/2526SanPabloLogo.png",
      "Real Madrid": "https://static.acb.com/img/www/clubes2024/2324RealMadrid_Logoweb.png",
      "Surne Bilbao": "https://static.acb.com/img/www/clubes2022/logo_surnebb_pos.png",
      "Kosner Baskonia": "https://static.acb.com/img/www/clubes2025/2526KosnerBaskoniaLogo.png",
      "Casademont Zaragoza": "https://static.acb.com/img/www/clubes2024/2425CasademontZaragoza.png",
      "Ucam Murcia": "https://static.acb.com/img/www/clubes2026/202627ucamcblogoverticalcolor.png",
      "UCAM Murcia": "https://static.acb.com/img/www/clubes2026/202627ucamcblogoverticalcolor.png",
      "Leyma Coruna": "https://static.acb.com/img/www/clubes2026/202627LeymaCorunaLogoPositivoOK.png",
      "Leyma Coruña": "https://static.acb.com/img/www/clubes2026/202627LeymaCorunaLogoPositivoOK.png",
      "Monbus Obradoiro": "https://static.acb.com/img/www/clubes2026/202627MonbusObradoiroLogoPositivoOK.png",
      "Ilerna Lleida": "https://static.acb.com/img/www/clubes2026/202526IlernaLleidaLogoPositivo.png",
      "Rio Breogan": "https://static.acb.com/logos/1718/breogan_00.png",
      "Río Breogán": "https://static.acb.com/logos/1718/breogan_00.png",
      "Fiatc Girona": "https://static.acb.com/img/www/clubes2026/202627FIATCGironaLogoPositivo.png",
      "FIATC Girona": "https://static.acb.com/img/www/clubes2026/202627FIATCGironaLogoPositivo.png",
      "Kidsandus Manresa": "https://static.acb.com/img/www/clubes2026/202526KidsUsManresa.png",
      "La Laguna Tenerife": "https://static.acb.com/img/www/clubes2024/2425LaLagunaTenerifeLogo.png",
      "Morabanc Andorra": "https://static.acb.com/img/www/clubes2026/20252026MorabancAndorraLogoPositivoOK.png",
      "MoraBanc Andorra": "https://static.acb.com/img/www/clubes2026/20252026MorabancAndorraLogoPositivoOK.png",
      "Barca": "https://static.acb.com/img/www/clubes2024/2324BarcaLogoweb.png",
      "Barça": "https://static.acb.com/img/www/clubes2024/2324BarcaLogoweb.png",
      "Asisa Joventut": "https://static.acb.com/img/www/clubes2026/202526AsisaJoventutLogoPosisitvo.png",
      "Žalgiris": "https://lkl.lt/media/teams/svg/UomWxbkIMUnKNMEStxLWRBPQNVcdJJe0ySQMW1bK.svg",
      "Rytas": "https://lkl.lt/media/teams/svg/9HeCOlpWX1ZZmvNBSKRV9od4akkVpxGhqUJANCwR.svg",
      "Neptūnas": "https://lkl.lt/media/teams/svg/GKanfxqGpxv115qVzaXi9R0FyY0I8A8agBklYBx4.svg",
      "Lietkabelis": "https://lkl.lt/media/teams/svg/T5zZbk6ub8Hc6SDeguAhz4RbmsSVzEmXltbSE4V1.svg",
      "Šiauliai": "https://lkl.lt/media/teams/svg/LsUag0UVSismYkn4glXiARAwqrxk7b7GoM7OyrXF.svg",
      "Juventus": "https://lkl.lt/media/teams/svg/mhb3G6WvSBlYOhKmDeBtzWp7lOTSXjO5BMpWoyYY.svg",
      "Nevėžis-Paskolų klubas": "https://lkl.lt/media/teams/svg/HBPZEiGV3DmSADvowvnAcFwGGEticKi32ONNf9F2.svg",
      "Gargždai": "https://lkl.lt/media/teams/svg/sQ4a0Ns4gi5QPEv1k1RHG9fxWVBob3dATIuixWiZ.svg",
      "Tauragė": "https://lkl.lt/media/teams/svg/CV8HGyUwqqnTrdsEIkszyODzKyIysAFWQ6266CuZ.svg",
      "Hipocredit": "https://lkl.lt/media/teams/svg/cExP0PVSuiRrENAHoUtVmnfyRPfb3mp4x2hJzu7h.svg",
      "Jonavos Hipocredit": "https://lkl.lt/media/teams/svg/cExP0PVSuiRrENAHoUtVmnfyRPfb3mp4x2hJzu7h.svg"
    };

    const DATA_PATHS = {
      acb: {
        averages: [
          "./data/attendance_averages.json",
          "./data/acb/attendance_averages.json",
          "./attendance_averages.json"
        ],
        matches: [
          "./data/matches.csv",
          "./data/acb/matches.csv",
          "./matches.csv"
        ]
      },
      lkl: {
        averages: [
          "./data/lkl/attendance_averages.json",
          "./attendance_averages.json",
          "./data/attendance_averages.json"
        ],
        matches: [
          "./data/lkl/matches.csv",
          "./matches.csv",
          "./data/matches.csv"
        ]
      }
    };

    const fmt = (n) => (n == null || n === "" ? "—" : Number(n).toLocaleString("lt-LT"));
    const fmtDate = (iso) => {
      if (!iso) return "—";
      try {
        const d = new Date(iso);
        return d.toLocaleString("lt-LT", {
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", timeZone: "UTC"
        }) + " UTC";
      } catch { return iso; }
    };

    function logoUrl(club) {
      if (TEAM_LOGOS[club]) return TEAM_LOGOS[club];
      const key = Object.keys(TEAM_LOGOS).find(k =>
        k.toLowerCase() === (club || "").toLowerCase() ||
        (club || "").toLowerCase().includes(k.toLowerCase()) ||
        k.toLowerCase().includes((club || "").toLowerCase())
      );
      return key ? TEAM_LOGOS[key] : null;
    }

    function clubLogoHtml(club) {
      const url = logoUrl(club);
      if (url) {
        return '<img class="club-logo" src="' + url + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'" />';
      }
      return '<span class="club-logo missing">🏀</span>';
    }

    let league = "acb";
    let clubs = [];
    let sortKey = "average";
    let sortDir = "desc";
    let filter = "";

    async function fetchFirst(urls, expectLeague) {
      for (const u of urls) {
        try {
          const r = await fetch(u, { cache: "no-store" });
          if (!r.ok) continue;
          if (!expectLeague || !u.endsWith(".json")) return r;
          // check league field so ACB/LKL files don't mix
          const clone = r.clone();
          try {
            const j = await clone.json();
            const lg = (j.league || "").toUpperCase();
            const exp = expectLeague.toUpperCase();
            if (lg === exp || lg.includes(exp) || exp.includes(lg)) {
              return new Response(JSON.stringify(j), {
                status: 200,
                headers: { "Content-Type": "application/json" }
              });
            }
          } catch (_) { return r; }
        } catch (_) {}
      }
      return null;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = lines[0].split(",");
      return lines.slice(1).map(line => {
        const cols = line.split(",");
        const obj = {};
        headers.forEach((h, i) => { obj[h.trim()] = (cols[i] || "").trim(); });
        return obj;
      });
    }

    async function loadLeague(code) {
      league = code;
      document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.league === code);
      });
      document.getElementById("app").innerHTML = '<div class="loading">Kraunama…</div>';
      document.getElementById("meta").innerHTML = "";

      const paths = DATA_PATHS[code];
      try {
        const avgRes = await fetchFirst(paths.averages, code);
        if (!avgRes) throw new Error("Nerastas attendance_averages.json šiai lygai");
        const data = await avgRes.json();
        clubs = data.clubs || [];

        let matches = [];
        const mRes = await fetchFirst(paths.matches);
        if (mRes) matches = parseCSV(await mRes.text());

        render(data, matches);
      } catch (e) {
        document.getElementById("app").innerHTML =
          '<div class="error">Klaida: ' + e.message + '<br><small>Patikrink, ar data/ failai įkelti į repo.</small></div>';
      }
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s || "";
      return d.innerHTML;
    }

    function render(data, matches) {
      const withAtt = clubs.filter(c => c.average != null && c.home_games_counted > 0);
      const totalGames = withAtt.reduce((s, c) => s + c.home_games_counted, 0);
      const totalFans = withAtt.reduce((s, c) => s + (c.total || 0), 0);
      const leagueAvg = totalGames ? Math.round(totalFans / totalGames) : 0;
      const maxAvg = withAtt.length ? Math.max(...withAtt.map(c => c.average)) : 1;

      document.getElementById("meta").innerHTML =
        '<span>Sezonas: <strong>' + (data.season || "—") + '</strong></span>' +
        '<span>Atnaujinta: <strong>' + fmtDate(data.updated) + '</strong></span>';

      const matchesWithAtt = matches
        .filter(m => m.attendance && Number(m.attendance) > 0)
        .sort((a, b) => Number(b.attendance) - Number(a.attendance))
        .slice(0, 40);

      let matchesHtml = "";
      if (matchesWithAtt.length) {
        matchesHtml =
          '<div class="section-title">Rungtynės su lankomumu <span class="badge">' + matchesWithAtt.length + '</span></div>' +
          '<div class="panel"><div class="table-wrap"><table><thead><tr>' +
          '<th>Šeimininkai</th><th>Svečiai</th><th class="num">Lankomumas</th><th class="hide-sm">Šaltinis</th>' +
          '</tr></thead><tbody>' +
          matchesWithAtt.map(m =>
            '<tr>' +
            '<td><div class="club-cell">' + clubLogoHtml(m.home) + '<span class="club-name">' + esc(m.home) + '</span></div></td>' +
            '<td><div class="club-cell">' + clubLogoHtml(m.away) + '<span>' + esc(m.away) + '</span></div></td>' +
            '<td class="num" style="font-weight:600;color:var(--green)">' + fmt(m.attendance) + '</td>' +
            '<td class="hide-sm">' + (m.source_url ? '<a href="' + esc(m.source_url) + '" target="_blank" rel="noopener" style="color:var(--blue);font-size:.8rem">↗</a>' : '') + '</td>' +
            '</tr>'
          ).join("") +
          '</tbody></table></div></div>';
      }

      document.getElementById("app").innerHTML =
        '<div class="cards">' +
        '<div class="card"><div class="label">Klubai</div><div class="value blue">' + clubs.length + '</div></div>' +
        '<div class="card"><div class="label">Namų rungt.</div><div class="value">' + fmt(totalGames) + '</div></div>' +
        '<div class="card"><div class="label">Lyga vidurkis</div><div class="value accent">' + fmt(leagueAvg) + '</div></div>' +
        '<div class="card"><div class="label">Iš viso žiūr.</div><div class="value green">' + fmt(totalFans) + '</div></div>' +
        '</div>' +
        '<div class="panel"><div class="panel-header">' +
        '<h2>Namų lankomumo reitingas</h2>' +
        '<input class="search" type="search" placeholder="Ieškoti klubo…" id="search" />' +
        '</div><div class="table-wrap"><table><thead><tr>' +
        '<th data-key="rank" style="width:2.8rem">#</th>' +
        '<th data-key="club">Klubas <span class="sort-arrow"></span></th>' +
        '<th class="num" data-key="average">Vidurkis <span class="sort-arrow"></span></th>' +
        '<th class="num hide-sm" data-key="home_games_counted">Rungt. <span class="sort-arrow"></span></th>' +
        '<th class="num hide-sm" data-key="max">Maks. <span class="sort-arrow"></span></th>' +
        '<th class="num hide-sm" data-key="min">Min. <span class="sort-arrow"></span></th>' +
        '<th class="hide-sm">Santykis</th>' +
        '</tr></thead><tbody id="tbody"></tbody></table></div></div>' +
        matchesHtml;

      document.getElementById("search").addEventListener("input", function(e) {
        filter = e.target.value.toLowerCase().trim();
        renderTable(maxAvg);
      });
      document.querySelectorAll("thead th[data-key]").forEach(function(th) {
        th.addEventListener("click", function() {
          const key = th.dataset.key;
          if (key === "rank") return;
          if (sortKey === key) sortDir = sortDir === "desc" ? "asc" : "desc";
          else { sortKey = key; sortDir = key === "club" ? "asc" : "desc"; }
          renderTable(maxAvg);
        });
      });
      renderTable(maxAvg);
    }

    function renderTable(maxAvg) {
      let list = clubs.slice();
      if (filter) list = list.filter(c => c.club.toLowerCase().includes(filter));

      list.sort(function(a, b) {
        let va = a[sortKey], vb = b[sortKey];
        if (sortKey === "club") {
          va = (va || "").toLowerCase(); vb = (vb || "").toLowerCase();
          return sortDir === "asc" ? va.localeCompare(vb, "lt") : vb.localeCompare(va, "lt");
        }
        const na = va == null, nb = vb == null;
        if (na && nb) return a.club.localeCompare(b.club, "lt");
        if (na) return 1;
        if (nb) return -1;
        va = Number(va) || 0; vb = Number(vb) || 0;
        return sortDir === "asc" ? va - vb : vb - va;
      });

      const byAvg = clubs.filter(c => c.average != null).sort((a, b) => b.average - a.average);
      const rankMap = {};
      byAvg.forEach((c, i) => { rankMap[c.club] = i + 1; });

      document.querySelectorAll("thead th[data-key]").forEach(function(th) {
        th.classList.remove("sorted-asc", "sorted-desc");
        if (th.dataset.key === sortKey) th.classList.add(sortDir === "asc" ? "sorted-asc" : "sorted-desc");
      });

      const tbody = document.getElementById("tbody");
      tbody.innerHTML = list.map(function(c) {
        const has = c.average != null;
        const rank = rankMap[c.club];
        const rankCls = rank === 1 ? "r1" : rank === 2 ? "r2" : rank === 3 ? "r3" : "";
        const pct = has && maxAvg ? Math.round((c.average / maxAvg) * 100) : 0;
        return '<tr style="' + (has ? "" : "opacity:.55") + '">' +
          '<td><span class="rank ' + rankCls + '">' + (rank || "—") + '</span></td>' +
          '<td><div class="club-cell">' + clubLogoHtml(c.club) + '<span class="club-name">' + esc(c.club) + '</span></div></td>' +
          '<td class="num" style="font-weight:700;color:' + (has ? "var(--accent)" : "var(--muted)") + '">' + fmt(c.average) + '</td>' +
          '<td class="num hide-sm">' + fmt(c.home_games_counted) + '</td>' +
          '<td class="num hide-sm">' + fmt(c.max) + '</td>' +
          '<td class="num hide-sm">' + fmt(c.min) + '</td>' +
          '<td class="hide-sm"><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div></td>' +
          '</tr>';
      }).join("") || '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:1.5rem">Nerasta</td></tr>';
    }

    document.getElementById("tabs").addEventListener("click", function(e) {
      const btn = e.target.closest(".tab");
      if (btn) loadLeague(btn.dataset.league);
    });

    loadLeague("acb");
  </script>
</body>
</html>
