<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACB lankomumas · Liga Endesa</title>
  <meta name="description" content="Liga Endesa (ACB) namų rungtynių lankomumo statistika" />
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #141b24;
      --surface2: #1c2532;
      --border: #2a3544;
      --text: #e8eef5;
      --muted: #8b9bb0;
      --accent: #f5a623;
      --accent2: #3d8bfd;
      --green: #3dd68c;
      --red: #f07178;
      --rank1: #ffd700;
      --rank2: #c0c0c0;
      --rank3: #cd7f32;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(61, 139, 253, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(245, 166, 35, 0.06), transparent);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      padding-top: 0.5rem;
    }

    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header h1 span {
      color: var(--accent);
    }

    header .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      justify-content: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .meta strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Summary cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      text-align: center;
    }

    .card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .card .value {
      font-size: 1.45rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .card .value.accent { color: var(--accent); }
    .card .value.blue { color: var(--accent2); }
    .card .value.green { color: var(--green); }

    /* Table */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .panel-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .search {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.4rem 0.7rem;
      font-size: 0.85rem;
      width: 180px;
      outline: none;
    }

    .search:focus {
      border-color: var(--accent2);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead th {
      text-align: left;
      padding: 0.7rem 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
