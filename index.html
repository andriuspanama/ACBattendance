    }
    .tab {
      display: inline-flex; align-items: center; gap: .55rem;
      background: var(--surface); border: 1px solid var(--border);

      cursor: pointer; color: var(--muted); font-weight: 600; font-size: .9rem;
      transition: .15s ease;

      background: #fff; padding: 2px;

    .card .value.blue { color: var(--blue); }
    .card .value.green { color: var(--green); }

    .panel-header {

    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    thead th {
      text-align: left; padding: .65rem .9rem; font-size: .7rem;
      text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
      font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap;

    thead th.num, tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; }
    tbody tr:nth-child(odd) { background: var(--row); }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: rgba(61,139,253,.08); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: .7rem .9rem; vertical-align: middle; }

    .club-logo {

      background: #fff; padding: 2px; flex-shrink: 0;
    }
    .club-logo.missing {

      width: 28px; height: 28px; border-radius: 6px;
    }
    .club-name { font-weight: 600; }
    .rank {
      display: inline-flex; align-items: center; justify-content: center;

    .rank.r1 { background: var(--rank1); color: #1a1a1a; }

    .bar-track {

    .bar-fill {

    .section-title .badge {

      try {
        const d = new Date(iso);
        return d.toLocaleString("lt-LT", {
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", timeZone: "UTC"
        }) + " UTC";
      } catch { return iso; }
    };

    function logoUrl(club) {
      if (!club) return null;
      if (TEAM_LOGOS[club]) return TEAM_LOGOS[club];
      const cl = club.toLowerCase().trim();
      // exact case-insensitive
      const exact = Object.keys(TEAM_LOGOS).find(k => k.toLowerCase() === cl);
      if (exact) return TEAM_LOGOS[exact];
      // starts-with / full-word only (avoid Juventus↔Joventut)
      const partial = Object.keys(TEAM_LOGOS).find(k => {
        const kk = k.toLowerCase();
        if (kk.length < 4 || cl.length < 4) return false;
        // require one contains the other as whole token-ish, min 5 chars overlap for short names
        if (cl === kk) return true;
        if (cl.startsWith(kk) || kk.startsWith(cl)) return true;
        // "Nevėžis-Paskolų klubas" vs "Nevėžis"
        if (cl.includes(kk) && kk.length >= 6) return true;
        if (kk.includes(cl) && cl.length >= 6) return true;
        return false;
      });
      return partial ? TEAM_LOGOS[partial] : sharedLogo(club);

    ];
    const LOGO_ALIAS = {
      "UNA Hotels Reggio Emilia": "Pallacanestro Reggiana",
      "Dolomiti Energia Trentino": "Aquila Trento",
      "Borac Mozzart": "KK Borac Čačak",
      "AEK Athens": "AEK B.C.",
      "AEK": "AEK B.C."
    };
    const LOGO_STOP = new Set(("kk bc bk sk kb okk bkk hkk cb club klub basket basketball baloncesto basquet pallacanestro " +
      "koszykowka kosarlabda basketbol spor the de fc ks mks wks as bsc baskets towers city sport sports team").split(" "));
    // miestai, kuriuose keli klubai – vien pagal miestą nesiejama
    const LOGO_CITY = new Set(("athens athina riga rigas belgrade beograd istanbul ankara izmir milano roma rome warszawa " +
      "zagreb sarajevo ljubljana vilnius kaunas tallinn helsinki madrid barcelona berlin munchen paris sydney melbourne " +
      "bologna napoli torino thessaloniki podgorica skopje sofia bratislava wien vienna").split(" "));
    let sharedLogos = null, sharedKeys = [];
    const lwd = function(s) {
      return String(s == null ? "" : s).toLowerCase().replace(/ł/g, "l").replace(/đ/g, "d").replace(/ø/g, "o")
        .replace(/ı/g, "i").replace(/ß/g, "ss").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .split(/[^a-z0-9]+/).filter(Boolean);
    };
    const ltk = function(s) { return lwd(s).filter(function(w) { return w.length >= 3 && !LOGO_STOP.has(w); }); };

    async function loadSharedLogos() {
      if (sharedLogos) return;
      sharedLogos = {};
      for (const u of LOGO_SOURCES) {
        try {
          const r = await fetch(u, { cache: "no-store" });
          if (!r.ok) continue;
          sharedLogos = await r.json();
          break;
        } catch (_) {}
      }
      sharedKeys = Object.keys(sharedLogos).map(function(k) { return { k: k, t: ltk(k), w: lwd(k), n: lwd(k).join("") }; });
    }

    function sharedLogo(club) {
      if (!sharedKeys.length || !club) return null;
      const name = LOGO_ALIAS[club] || club;
      const n = lwd(name).join(""), t = ltk(name), w = lwd(name);
      const ex = sharedKeys.find(function(x) { return x.n === n; });
      if (ex) return sharedLogos[ex.k];
      const pick = function(c, score) {
        if (!c.length) return null;
        c.sort(function(a, b) { return score(b) - score(a); });
        const file = function(x) {
          try { return decodeURIComponent(sharedLogos[x.k].split("/").pop()).replace(/^\d+px-/, "").toLowerCase(); }
          catch (_) { return sharedLogos[x.k]; }
        };
        if (c.length > 1 && score(c[0]) === score(c[1]) && file(c[0]) !== file(c[1])) return null;
        return sharedLogos[c[0].k];
      };
      const raw = function(x) { return x.w.filter(function(v) { return w.includes(v); }).length; };
      // visi reikšmingi vieno pavadinimo žodžiai yra kitame
      let c = sharedKeys.filter(function(x) {
        return x.t.length && x.t.join("").length > 3 && t.length &&
          (x.t.every(function(v) { return t.includes(v); }) || t.every(function(v) { return x.t.includes(v); }));
      });
      // daugiau bendrų žodžių – geriau; papildomi (nesutampantys) žodžiai – blogiau
      let got = pick(c, function(x) {
        const common = x.t.filter(function(v) { return t.includes(v); }).length;
        return common * 10 - (x.t.length - common) + raw(x) * 0.5;
      });
      if (got || c.length) return got;
      // bent vienas retas (ne miesto) žodis sutampa
      c = sharedKeys.filter(function(x) {
        return x.t.some(function(v) { return v.length >= 4 && !LOGO_CITY.has(v) && t.includes(v); });
      });
      return pick(c, function(x) { return x.t.filter(function(v) { return v.length >= 4 && t.includes(v); }).length * 10 + raw(x); });
    }

    // BBL/BSL: logotipai laikomi logos/<lyga>/<KODAS>.png (pvz. logos/bbl/HAM.png).
    // Jei failo nėra, rodomas 3 raidžių kodas.
    function clubLogoHtml(club, code) {
      if (code) {
        const alt = logoUrl(club);
        return '<img class="club-logo" src="./logos/' + league + '/' + code + '.png" alt="" loading="lazy" ' +
          (alt ? 'data-alt="' + esc(alt) + '" ' : '') +
          'onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.removeAttribute(\'data-alt\')}else{this.outerHTML=\'<span class=&quot;club-logo missing&quot;>' + code + '</span>\'}" />';
      }
      const url = logoUrl(club);
      if (url) {
        return '<img class="club-logo" src="' + url + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'" />';
      }
      return '<span class="club-logo missing">🏀</span>';
    }

    let league = "acb";
    let capInfo = null;
    let runStatus = null;
    let lastAttGame = "";
    let clubs = [];
    let sortKey = "average";
    let sortDir = "desc";
    let filter = "";

    async function fetchFirst(urls, expectLeague) {
      for (const u of urls) {
        try {
          const r = await fetch(u, { cache: "no-store" });
          if (!r.ok) continue;
          if (!expectLeague || !u.endsWith(".json")) return r;
          // check league field so ACB/LKL/BBL files don't mix
          const clone = r.clone();
          try {
            const j = await clone.json();
            const lg = (j.league || "").toUpperCase();
            const exp = expectLeague.toUpperCase();
            if (lg === exp || lg.includes(exp) || exp.includes(lg)) {
              return new Response(JSON.stringify(j), {
                status: 200,
                headers: { "Content-Type": "application/json" }
              });
            }
          } catch (_) { return r; }
        } catch (_) {}
      }
      return null;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = lines[0].split(",");
      return lines.slice(1).map(line => {
        const cols = line.split(",");
        const obj = {};
        headers.forEach((h, i) => { obj[h.trim()] = (cols[i] || "").trim(); });
        return obj;
      });
    }

    async function loadLeague(code) {
      league = code;
      document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.league === code);
      });
      document.getElementById("app").innerHTML = '<div class="loading">Kraunama…</div>';
      document.getElementById("meta").innerHTML = "";

      const paths = DATA_PATHS[code];
      try {
        await loadSharedLogos();
        const avgRes = await fetchFirst(paths.averages, code);
        if (!avgRes) throw new Error("Nerastas attendance_averages.json šiai lygai");
        const data = await avgRes.json();
        clubs = data.clubs || [];

        // Arenos talpa (capacity.json – skaičiuoja capacities.py iš lapo „Arenas“)
        capInfo = null;
        try {
          const cr = await fetch(paths.averages[0].replace("attendance_averages.json", "capacity.json"), { cache: "no-store" });
          if (cr.ok) capInfo = await cr.json();
        } catch (_) {}
        // Rinkiklio būsena (run_status.json) – ar paskutinis nuskaitymas pavyko
        runStatus = null;
        try {
          const sr = await fetch(paths.averages[0].replace("attendance_averages.json", "run_status.json"), { cache: "no-store" });
          if (sr.ok) runStatus = await sr.json();
        } catch (_) {}
        if (capInfo && capInfo.clubs) {
          const byClub = {};
          capInfo.clubs.forEach(function(x) { byClub[x.club] = x; });
          clubs.forEach(function(c) {
            const x = byClub[c.club];
            c.weighted_capacity = x ? x.weighted_capacity : null;
            c.filling_rate = x ? x.filling_rate : null;
          });
        }

        let matches = [];
        const mRes = await fetchFirst(paths.matches);
        if (mRes) matches = parseCSV(await mRes.text());
        lastAttGame = (capInfo && capInfo.last_attendance_game) || "";
        if (!/^20\d\d-/.test(lastAttGame)) lastAttGame = "";
        matches.forEach(function(m) {
          // ACB rinkiklis datų nefiksuoja (0000-00-00) – tada imama, kada lankomumas rastas
          const d = /^20\d\d-\d\d-\d\d/.test(m.date || "") ? m.date : (m.checked_at || "").slice(0, 10);
          if (Number(m.attendance) > 0 && /^20\d\d-/.test(d) && d > lastAttGame) lastAttGame = d;
        });

        render(data, matches);
      } catch (e) {
        document.getElementById("app").innerHTML =
          '<div class="error">Klaida: ' + e.message + '<br><small>Patikrink, ar data/ failai įkelti į repo.</small></div>';
      }
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s || "";
      return d.innerHTML;
    }

    function render(data, matches) {
      const withAtt = clubs.filter(c => c.average != null && c.home_games_counted > 0);
      const totalGames = withAtt.reduce((s, c) => s + c.home_games_counted, 0);
      const totalFans = withAtt.reduce((s, c) => s + (c.total || 0), 0);
      const leagueAvg = totalGames ? Math.round(totalFans / totalGames) : 0;
      const maxAvg = withAtt.length ? Math.max(...withAtt.map(c => c.average)) : 1;

      document.getElementById("meta").innerHTML =
        '<span>Sezonas: <strong>' + (data.season || "—") + '</strong></span>' +
        '<span>Atnaujinta: <strong>' + fmtDate(data.updated) + '</strong></span>';

      const matchesWithAtt = matches
        .filter(m => m.attendance && Number(m.attendance) > 0)
        .sort((a, b) => Number(b.attendance) - Number(a.attendance))
        .slice(0, 40);

      let matchesHtml = "";
      if (matchesWithAtt.length) {
        matchesHtml =
          '<div class="section-title">Rungtynės su lankomumu <span class="badge">' + matchesWithAtt.length + '</span></div>' +
          '<div class="panel"><div class="table-wrap"><table><thead><tr>' +
          '<th>Šeimininkai</th><th>Svečiai</th><th class="num">Lankomumas</th><th class="hide-sm">Šaltinis</th>' +
          '</tr></thead><tbody>' +
          matchesWithAtt.map(m => {
            const src = m.source_url || m.url;
            return '<tr>' +
            '<td><div class="club-cell">' + clubLogoHtml(m.home, m.home_code) + '<span class="club-name">' + esc(m.home) + '</span></div></td>' +
            '<td><div class="club-cell">' + clubLogoHtml(m.away, m.away_code) + '<span>' + esc(m.away) + '</span></div></td>' +
            '<td class="num" style="font-weight:600;color:var(--green)">' + fmt(m.attendance) + '</td>' +
            '<td class="hide-sm">' + (src ? '<a href="' + esc(src) + '" target="_blank" rel="noopener" style="color:var(--blue);font-size:.8rem">↗</a>' : '') + '</td>' +
            '</tr>';
          }).join("") +
          '</tbody></table></div></div>';
      }

      document.getElementById("app").innerHTML =
        '<div class="cards">' +
        '<div class="card"><div class="label">Klubai</div><div class="value blue">' + clubs.length + '</div></div>' +
        '<div class="card"><div class="label">Namų rungt.</div><div class="value">' + fmt(totalGames) + '</div></div>' +
        '<div class="card"><div class="label">Lyga vidurkis</div><div class="value accent">' + fmt(leagueAvg) + '</div></div>' +
        '<div class="card"><div class="label">Iš viso žiūr.</div><div class="value green">' + fmt(totalFans) + '</div></div>' +
        '</div>' +
        '<div class="panel"><div class="panel-header">' +
        '<h2>Namų lankomumo reitingas</h2>' +
        '<input class="search" type="search" placeholder="Ieškoti klubo…" id="search" />' +
        '</div><div class="table-wrap"><table><thead><tr>' +
        '<th data-key="rank" style="width:2.8rem">#</th>' +
        '<th data-key="club">Klubas <span class="sort-arrow"></span></th>' +
        '<th class="num" data-key="average">Vidurkis <span class="sort-arrow"></span></th>' +
        '<th class="num hide-sm" data-key="weighted_capacity" title="Vidutinė talpa pagal arenas, kuriose iš tikrųjų žaista">Galima arenos talpa <span class="sort-arrow"></span></th>' +
        '<th class="num hide-sm" data-key="filling_rate" title="Žiūrovų suma / arenų talpų suma">Užpildymas <span class="sort-arrow"></span></th>' +
        '<th class="num hide-sm" data-key="home_games_counted">Rungt. <span class="sort-arrow"></span></th>' +
        '<th class="num hide-sm" data-key="max">Maks. <span class="sort-arrow"></span></th>' +
        '<th class="num hide-sm" data-key="min">Min. <span class="sort-arrow"></span></th>' +
        '<th class="hide-sm">Santykis</th>' +
        '</tr></thead><tbody id="tbody"></tbody></table></div></div>' +
        healthHtml() +
        missingCapHtml() +
        matchesHtml;

      document.getElementById("search").addEventListener("input", function(e) {
        filter = e.target.value.toLowerCase().trim();
        renderTable(maxAvg);
      });
      document.querySelectorAll("thead th[data-key]").forEach(function(th) {
        th.addEventListener("click", function() {
          const key = th.dataset.key;
          if (key === "rank") return;
          if (sortKey === key) sortDir = sortDir === "desc" ? "asc" : "desc";
          else { sortKey = key; sortDir = key === "club" ? "asc" : "desc"; }
          renderTable(maxAvg);
        });
      });
      renderTable(maxAvg);
    }

    // Įspėjimas, jei lygos svetainė nebeduoda duomenų (blokuoja, pasikeitė) arba naujo lankomumo seniai nėra
    function healthHtml() {
      const out = [];
      const now = new Date();
      const days = function(iso) { return Math.floor((now - new Date(iso)) / 86400000); };
      const when = function(iso) {
        const d = new Date(iso);
        return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + " " +
          String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      };
      const st = runStatus;
      if (st) {
        const src = st.source ? " (" + esc(st.source) + ")" : "";
        if (st.ok === false) {
          out.push("Paskutinis duomenų nuskaitymas" + src + (st.run_at ? " " + when(st.run_at) : "") +
            " nepavyko: " + esc(st.error || "nežinoma klaida") +
            (st.last_ok ? ". Paskutinį kartą pavyko " + when(st.last_ok) : ""));
        } else if (st.last_ok && days(st.last_ok) >= 2) {
          out.push("Duomenys" + src + " sėkmingai nuskaityti tik prieš " + days(st.last_ok) + " d. – patikrinkite GitHub Actions");
        }
        (st.notes || []).forEach(function(n) { out.push(esc(n) + src); });
      }
      // Naujo lankomumo nėra ilgiau nei 14 d., nors vyksta sezonas (spal. 1 – geg. 20; NBL – iki kov. 15)
      if (lastAttGame) {
        const md = (now.getMonth() + 1) * 100 + now.getDate();
        const end = league === "nbl" ? 315 : 520;
        const inSeason = md >= 1001 || md <= end;
        const gap = days(lastAttGame + "T12:00:00");
        if (inSeason && gap > 14) {
          out.push("Naujo lankomumo nėra nuo " + esc(lastAttGame) + " (" + gap + " d.). Jei lyga tuo metu žaidė – " +
            (league === "bsl" ? "įklijuokite naujas rungtynes į lapą „BSL 26/27 games“ arba patikrinkite, ar FIBA LiveStats veikia"
                              : "svetainė gali blokuoti skaitymą arba nebeskelbia lankomumo"));
        }
      }
      if (!out.length) return "";
      return out.map(function(t) {
        return '<div class="meta" style="margin:.6rem 0 0;justify-content:flex-start;color:var(--accent)">⚠ ' + t + '</div>';
      }).join("");
    }

    // Įspėjimas: rungtynės su lankomumu, kurių arenos talpos nėra lape „Arenas“
    function missingCapHtml() {
      const u = (capInfo && capInfo.unknown_arenas) || [];
      if (!u.length) return "";
      return '<div class="meta" style="margin:.6rem 0 0;justify-content:flex-start;color:var(--accent)">⚠ Trūksta arenos talpos: ' +
        u.map(function(x) {
          return '<strong>' + esc(x.arena) + '</strong> (' + esc((x.clubs || []).join(", ")) + ', ' + x.games + ' rungt.)';
        }).join("; ") +
        ' – įrašykite į lapą „Arenas“</div>';
    }

    function renderTable(maxAvg) {
      let list = clubs.slice();
      if (filter) list = list.filter(c => c.club.toLowerCase().includes(filter));

      list.sort(function(a, b) {
        let va = a[sortKey], vb = b[sortKey];
        if (sortKey === "club") {
          va = (va || "").toLowerCase(); vb = (vb || "").toLowerCase();
          return sortDir === "asc" ? va.localeCompare(vb, "lt") : vb.localeCompare(va, "lt");
        }
        const na = va == null, nb = vb == null;
        if (na && nb) return a.club.localeCompare(b.club, "lt");
        if (na) return 1;
        if (nb) return -1;
        va = Number(va) || 0; vb = Number(vb) || 0;
        return sortDir === "asc" ? va - vb : vb - va;
      });

      const byAvg = clubs.filter(c => c.average != null).sort((a, b) => b.average - a.average);
      const rankMap = {};
      byAvg.forEach((c, i) => { rankMap[c.club] = i + 1; });

      document.querySelectorAll("thead th[data-key]").forEach(function(th) {
        th.classList.remove("sorted-asc", "sorted-desc");
        if (th.dataset.key === sortKey) th.classList.add(sortDir === "asc" ? "sorted-asc" : "sorted-desc");
      });

      const tbody = document.getElementById("tbody");
      tbody.innerHTML = list.map(function(c) {
        const has = c.average != null;
        const rank = rankMap[c.club];
        const rankCls = rank === 1 ? "r1" : rank === 2 ? "r2" : rank === 3 ? "r3" : "";
        const pct = has && maxAvg ? Math.round((c.average / maxAvg) * 100) : 0;
        return '<tr style="' + (has ? "" : "opacity:.55") + '">' +
          '<td><span class="rank ' + rankCls + '">' + (rank || "—") + '</span></td>' +
          '<td><div class="club-cell">' + clubLogoHtml(c.club, c.code) + '<span class="club-name">' + esc(c.club) + '</span></div></td>' +
          '<td class="num" style="font-weight:700;color:' + (has ? "var(--accent)" : "var(--muted)") + '">' + fmt(c.average) + '</td>' +
          '<td class="num hide-sm">' + fmt(c.weighted_capacity) + '</td>' +
          '<td class="num hide-sm">' + (c.filling_rate != null ? fmtPct(c.filling_rate) : "—") + '</td>' +
          '<td class="num hide-sm">' + fmt(c.home_games_counted) + '</td>' +
          '<td class="num hide-sm">' + fmt(c.max) + '</td>' +
          '<td class="num hide-sm">' + fmt(c.min) + '</td>' +
          '<td class="hide-sm"><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div></td>' +
          '</tr>';
      }).join("") || '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:1.5rem">Nerasta</td></tr>';
    }

    document.getElementById("tabs").addEventListener("click", function(e) {
      const btn = e.target.closest(".tab");
      if (btn) loadLeague(btn.dataset.league);
    });

    loadLeague("acb");
  </script>
</body>
